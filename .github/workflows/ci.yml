name: Import Quant Terminal source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'anfor183/quant-terminal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage source part 1
        run: printf '%s' '' >> /tmp/qt-source.b64
      - name: Stage source part 2
        run: printf '%s' '' >> /tmp/qt-source.b64
