      - name: Stage source part 30
        run: printf '%s' '' >> /tmp/qt-source.b64
      - name: Stage source part 31
        run: printf '%s' '' >> /tmp/qt-source.b64
      - name: Publish source files
        run: |
          base64 --decode /tmp/qt-source.b64 | tar -xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Quant Terminal source and documentation'
          git push
